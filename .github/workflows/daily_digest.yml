name: Daily digest

on:
  schedule:
    # 08:00 IST, Monday-Friday, plus backup slots at 08:30 and 09:00 IST: GitHub's scheduler
    # is best-effort and sometimes drops or delays triggers. Backup runs exit immediately
    # once today's digest exists.
    - cron: "30 2 * * 1-5"
    - cron: "0 3 * * 1-5"
    - cron: "30 3 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today is an NSE holiday"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          SCORING_MODEL: ${{ vars.SCORING_MODEL }}
          MAX_DAILY_LLM_USD: ${{ vars.MAX_DAILY_LLM_USD }}
          TZ: Asia/Kolkata
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python run_pipeline.py --force
          else
            python run_pipeline.py
          fi

      - name: Commit digest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Add only paths that exist: one missing pathspec makes `git add` stage nothing.
          for p in data/digests data/latest.json data/evaluation.csv data/reference; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          git status --short data
          if git diff --cached --quiet; then
            echo "No changes to commit (holiday or nothing new)."
          else
            git commit -m "Digest $(TZ=Asia/Kolkata date +%Y-%m-%d) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
